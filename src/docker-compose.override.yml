services:
  eventdb:
    container_name: eventdb
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-EventDb}
    ports:
      - "5432:5432"
    volumes:
      - eventdbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  eventforge.api:
    container_name: eventforge.api
    env_file:
      - .env.docker
    environment:
      DB_HOST: ${DB_HOST:-eventdb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-EventDb}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_INCLUDE_ERROR_DETAIL: ${DB_INCLUDE_ERROR_DETAIL:-true}
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      eventdb:
        condition: service_healthy
