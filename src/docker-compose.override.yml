services:
  eventdb:
    container_name: eventdb
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - eventdbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  eventforge.api:
    container_name: eventforge.api
    env_file:
      - .env
    environment:
      ConnectionStrings__Database: "Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};Include Error Detail=${DB_INCLUDE_ERROR_DETAIL}"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      eventdb:
        condition: service_healthy
    
  eventforge.web:
    container_name: eventforge.web
    ports:
      - "8082:8080"
    environment:
      Api__BaseUrl: "http://eventforge.api:8080/api/v1/"
    depends_on:
      - eventforge.api
